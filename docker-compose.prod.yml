version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ontrip-postgres
    environment:
      POSTGRES_DB: ontrip
      POSTGRES_USER: ontrip_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontrip_user -d ontrip"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ontrip-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: ontrip-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ontrip-network

  # Backend API (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ontrip-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://ontrip_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ontrip
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ontrip-network
    restart: unless-stopped

  # Python Workers (Celery)
  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: ontrip-workers
    environment:
      DATABASE_URL: postgresql://ontrip_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ontrip
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      VIATOR_API_KEY: ${VIATOR_API_KEY}
      GETYOURGUIDE_API_KEY: ${GETYOURGUIDE_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ontrip-network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: ontrip-celery-beat
    command: celery -A src.tasks beat --loglevel=info
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      - redis
    networks:
      - ontrip-network
    restart: unless-stopped

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ontrip-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - ontrip-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ontrip-network:
    driver: bridge
