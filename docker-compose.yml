version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ontrip-postgres
    environment:
      POSTGRES_DB: ontrip
      POSTGRES_USER: ontrip_user
      POSTGRES_PASSWORD: ontrip_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontrip_user -d ontrip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ontrip-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch (optional, for phase 2)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
  #   container_name: ontrip-elasticsearch
  #   environment:
  #     discovery.type: single-node
  #     "ES_JAVA_OPTS": "-Xms512m -Xmx512m"
  #   ports:
  #     - '9200:9200'
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ontrip-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ontrip_user:ontrip_dev_password@postgres:5432/ontrip
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      API_PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - /app/node_modules
    command: npm run dev
    networks:
      - ontrip-network

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ontrip-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - /app/node_modules
    command: npm run dev
    networks:
      - ontrip-network

volumes:
  postgres_data:
  redis_data:

networks:
  ontrip-network:
    driver: bridge
